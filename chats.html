<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0088cc">
<link rel="manifest" href="manifest.json">
<title>RZ-Chat</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<!-- ============ تب چت‌ها ============ -->
<section id="tab-chats" class="tab-page active">
    <header class="header">
        <div class="header-info">
            <div class="avatar" id="my-avatar" onclick="showTab('settings')" style="cursor:pointer">؟</div>
            <div>
                <h1>RZ-Chat</h1>
                <span id="user-name"></span>
            </div>
        </div>
        <button id="logout-btn" onclick="logout()">خروج</button>
    </header>

    <!-- 🔍 جستجو در چت‌ها و پیام‌ها (جدید) -->
    <div class="search-wrap">
        <span class="search-ic">🔍</span>
        <input id="chat-search" type="text" placeholder="جستجو در چت‌ها و پیام‌ها..."
            oninput="onChatSearchInput(this)">
    </div>

    <div id="chat-list"></div>

    <button class="fab" onclick="showTab('contacts')" title="مخاطبین">＋</button>
</section>

<!-- ============ تب مخاطبین ============ -->
<section id="tab-contacts" class="tab-page">
    <header class="header">
        <div class="header-info">
            <div class="avatar" onclick="showTab('chats')" style="cursor:pointer">→</div>
            <div><h1>مخاطبین</h1></div>
        </div>
    </header>

    <!-- 🔍 جستجو در مخاطبین (جدید) -->
    <div class="search-wrap">
        <span class="search-ic">🔍</span>
        <input id="contact-search" type="text" placeholder="جستجوی مخاطبین..."
            oninput="onContactSearchInput(this)">
    </div>

    <div class="contact-actions">
        <button onclick="location.href='create.html?type=group'">👥 ساخت گروه</button>
        <button onclick="location.href='create.html?type=channel'">📢 ساخت کانال</button>
    </div>

    <div id="contact-list"></div>

    <button class="fab" onclick="openAddContact()" title="افزودن مخاطب">＋</button>
</section>

<!-- ============ تب تنظیمات ============ -->
<section id="tab-settings" class="tab-page">
    <header class="header">
        <div class="header-info">
            <div class="avatar" onclick="showTab('chats')" style="cursor:pointer">→</div>
            <div><h1>تنظیمات</h1></div>
        </div>
    </header>

    <div class="settings-box">
        <div class="avatar-edit">
            <div class="avatar big" id="set-avatar" onclick="document.getElementById('photo-input').click()" style="cursor:pointer">؟</div>
            <button class="small-btn" onclick="document.getElementById('photo-input').click()">📷 تغییر عکس پروفایل</button>
            <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="uploadPhoto(this)">
        </div>

        <label>نام نمایشی</label>
        <input id="set-name" type="text">

        <label>آیدی (حروف انگلیسی، عدد و _)</label>
        <div class="username-field">
            <span>@</span>
            <input id="set-username" type="text" placeholder="username">
        </div>

        <label>بیوگرافی</label>
        <input id="set-bio" type="text" placeholder="درباره من...">

        <button onclick="saveProfile()">💾 ذخیره پروفایل</button>

        <hr class="sep">

        <div class="setting-row">
            <span>🔔 اعلان پیام‌های جدید</span>
            <button class="small-btn" onclick="askNotifPerm()">فعال‌سازی</button>
        </div>

        <div class="setting-row">
            <span>🌙 حالت شب</span>
            <label class="switch">
                <input type="checkbox" id="dark-toggle" onchange="toggleDark(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-row info">
            <span>📧 ایمیل حساب</span>
            <span id="info-email" class="muted"></span>
        </div>
        <div class="setting-row info">
            <span>📱 شماره</span>
            <span id="info-phone" class="muted"></span>
        </div>

        <button class="gray" onclick="logout()">🚪 خروج از حساب</button>
    </div>
</section>

<!-- ============ مودال افزودن مخاطب ============ -->
<div id="add-modal" class="modal-overlay" onclick="if(event.target===this) closeAddContact()">
    <div class="modal">
        <h3>افزودن مخاطب</h3>
        <p class="hint">با @آیدی، ایمیل یا شماره تلفن جستجو کن</p>
        <input id="add-query" type="text" placeholder="@username یا email یا 09123456789"
            onkeydown="if(event.key === 'Enter') searchContact()">
        <div id="add-result"></div>
        <button class="gray" onclick="closeAddContact()">بستن</button>
    </div>
</div>

<!-- ============ منوی راست‌کلیک ============ -->
<div id="ctx-menu"></div>

<!-- ============ 📱 نوار «ادامه در اپ» (جدید) ============ -->
<div id="rz-openapp" style="display:none; position:fixed; bottom:14px; right:14px; left:14px; z-index:9999; align-items:center; gap:10px; background:linear-gradient(135deg,#0088cc,#22a5e0); color:#fff; border-radius:16px; padding:12px 14px; font-family:tahoma; font-size:14px; font-weight:bold; box-shadow:0 10px 30px rgba(0,60,100,.35);">
    <button onclick="rzCloseOpenApp()" style="background:rgba(255,255,255,.22); border:none; color:#fff; width:28px; height:28px; border-radius:50%; font-size:14px; cursor:pointer; flex-shrink:0; line-height:1;">✕</button>
    <div style="flex:1; line-height:1.8;">
        ادامه در اپلیکیشن RZ-Chat
        <div style="font-size:11px; font-weight:normal; opacity:.85;">سریع‌تر، تمام‌صفحه و بدون مرورگر</div>
    </div>
    <button onclick="rzOpenApp()" style="background:#fff; color:#0088cc; border:none; border-radius:12px; padding:9px 16px; font-family:tahoma; font-size:13px; font-weight:bold; cursor:pointer; flex-shrink:0;">باز کن 🚀</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="chats.js?v=10"></script>
<!-- 📞 تماس صوتی و تصویری (جدید) — فقط این خط اضافه شده -->
<script type="module" src="call.js?v=1"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
<script>
/* ---------- 📱 باز کردن اپ از روی سایت (جدید) ---------- */
function rzOpenApp() {
  location.href = "intent://rz-chat.rz-ai.workers.dev/chats.html#Intent;scheme=https;S.browser_fallback_url=" +
    encodeURIComponent("https://rz-chat.rz-ai.workers.dev/chats.html") + ";package=com.rzai.rzchat;end";
}
function rzCloseOpenApp() {
  var bar = document.getElementById("rz-openapp");
  if (bar) bar.style.display = "none";
  try { localStorage.setItem("rz-openapp-dismissed", "1"); } catch (e) {}
}
(function () {
  try {
    /* داخل خود اپ (TWA / PWA نصب‌شده) نشان نده */
    var inApp = window.matchMedia("(display-mode: standalone)").matches;
    var isPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.matchMedia("(max-width: 820px)").matches;
    var dismissed = localStorage.getItem("rz-openapp-dismissed") === "1";
    if (inApp || !isPhone || dismissed) return;
    var bar = document.getElementById("rz-openapp");
    if (!bar) return;
    bar.style.display = "flex";
    if (localStorage.getItem("dark") === "1") {
      bar.style.background = "linear-gradient(135deg,#0d5c85,#1277a8)";
    }
  } catch (e) {}
})();
</script>
</body>
</html>
