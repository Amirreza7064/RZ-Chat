<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0088cc">
<link rel="manifest" href="manifest.json">
<title>ساخت | RZ-Chat</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<div class="page-box" id="create-form">
    <h2 id="page-title">ساخت گروه</h2>

    <label>نام</label>
    <input id="chat-name" type="text" placeholder="مثلاً: دوستان RZ">

    <label>توضیحات</label>
    <input id="chat-desc" type="text" placeholder="اختیاری">

    <label>افزودن اعضا از مخاطبین:</label>
    <div id="member-picker" class="member-picker">
        <p class="hint">⏳ در حال بارگذاری مخاطبین...</p>
    </div>

    <button onclick="createChat()">ساخت ✨</button>
    <button class="gray" onclick="location.href='chats.html'">انصراف</button>
</div>

<div class="page-box" id="created-box" style="display:none">
    <h2>✅ ساخته شد!</h2>
    <p class="hint">این لینک را برای دوستانت بفرست تا عضو شوند:</p>
    <input id="new-invite-link" readonly onclick="this.select()">
    <button onclick="copyNewInvite()">کپی لینک 📋</button>
    <button class="gray" id="goto-chat-btn">برو به چت ←</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="create.js?v=9"></script>
</body>
</html>
