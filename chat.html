<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0088cc">
<link rel="manifest" href="manifest.json">
<title>RZ-Chat</title>
<link rel="stylesheet" href="style.css?v=9">
<style>
/* ============================================================
   🎨 کامپوزر شناور به سبک روبیکا (فقط صفحه چت)
   ============================================================ */

/* خود کامپوزر دیگه به لبه‌های صفحه نمیچسبه — دور تا دورش فاصله داره */
#composer {
  background: transparent;
  box-shadow: none;
  padding: 0;
  left: 8px;
  right: 8px;
  bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}

/* کادر پیام یک «قرص» یکپارچه‌ست؛ عکس، صوت، متن و ارسال همه داخل خود کادر نوشتن هستن */
#composer .send-box {
  background: #ffffff;
  border-radius: 26px;
  padding: 6px 8px;
  gap: 4px;
  align-items: center;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
}

/* فیلد متن داخل قرص، بدون پس‌زمینه‌ی جدا */
#composer .send-box input[type="text"] {
  background: transparent;
  padding: 10px 6px;
  min-width: 0;
  flex: 1;
}

/* دکمه‌ی عکس و صوت — کوچیک‌تر از قبل */
#composer .tool-btn {
  width: 36px;
  height: 36px;
  font-size: 16px;
  background: transparent;
  flex-shrink: 0;
}

#composer .tool-btn:hover { background: #e8f4fb; }

/* دکمه‌ی ارسال — دایره‌ی کامل؛ تا وقتی چیزی تایپ نشده کاملاً محو و جمع میشه */
#send-btn {
  flex: 0 0 auto;
  min-width: 0;
  overflow: hidden;
  width: 0;
  height: 44px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  background: linear-gradient(135deg, #22a5e0, #006daa);
  opacity: 0;
  transform: scale(.4);
  pointer-events: none;
  transition: width .25s ease, opacity .25s ease, transform .25s ease;
}

#send-btn.rz-on {
  width: 44px;
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

#send-btn:hover { filter: brightness(1.08); }

#send-btn:active { transform: scale(.9); }

/* نوار ضبط صدا هم مثل بقیه شناور و گرد */
#composer .rec-box {
  background: #ffffff;
  border-radius: 26px;
  padding: 8px 12px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
}

/* جای خالی کافی زیر پیام‌ها برای کامپوزر شناور */
#messages { padding-bottom: 110px; }

/* 🌙 حالت شب */
body.dark #composer { background: transparent; box-shadow: none; }

body.dark #composer .send-box,
body.dark #composer .rec-box {
  background: #1f2a36;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
}

body.dark #composer .send-box input[type="text"] { background: transparent; }

body.dark #composer .tool-btn { background: transparent; }

body.dark #composer .tool-btn:hover { background: #242f3d; }
</style>
</head>
<body>

<header class="header">
    <div class="header-info" id="chat-header">
        <div class="avatar" id="chat-icon">👥</div>
        <div>
            <h1 id="chat-title">RZ-Chat</h1>
            <span id="chat-sub"></span>
        </div>
    </div>
    <div class="header-actions">
        <button id="csearch-btn" class="hdr-btn" onclick="toggleSearch()" title="جستجو در گفتگو">🔍</button>
        <button id="invite-btn" class="hdr-btn" style="display:none"
            onclick="openInfo()">🔗 دعوت</button>
        <button id="logout-btn" onclick="location.href='chats.html'">بازگشت</button>
    </div>
</header>

<!-- 🔍 نوار جستجو داخل گفتگو (جدید) -->
<div id="search-bar" class="search-bar" style="display:none">
    <input id="search-input" type="text" placeholder="جستجو در این گفتگو..."
        oninput="onCSearch(this)" onkeydown="if(event.key === 'Enter') onCSearch(this,true)">
    <span id="search-count"></span>
    <button onclick="searchPrev()" title="قبلی">↑</button>
    <button onclick="searchNext()" title="بعدی">↓</button>
    <button onclick="closeSearch()" title="بستن">✖</button>
</div>

<div id="join-bar" class="join-bar" style="display:none">
    <span id="join-text"></span>
    <button onclick="joinChat()">عضویت ➕</button>
</div>

<div id="messages"></div>

<div id="composer" style="display:none">

    <div id="reply-bar" class="reply-bar" style="display:none">
        <div class="rb-line"></div>
        <div class="rb-mid">
            <div id="reply-name" class="reply-name"></div>
            <div id="reply-text" class="reply-text"></div>
        </div>
        <button class="rb-x" onclick="cancelReply()">✖</button>
    </div>

    <div class="send-box" id="send-box" style="display:none">
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="sendImage(this)">
        <button class="tool-btn" onclick="document.getElementById('img-input').click()" title="عکس">📷</button>
        <button class="tool-btn" id="mic-btn" onclick="startRecording()" title="پیام صوتی">🎤</button>
        <input id="messageInput" type="text" placeholder="پیام...">
        <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <div class="send-box rec-box" id="rec-box" style="display:none">
        <span class="rec-dot"></span>
        <span id="rec-time">0:00</span>
        <span class="rec-label">در حال ضبط... (حداکثر ۶۰ ثانیه)</span>
        <button class="rec-ok" onclick="stopRecording(true)" title="ارسال">✅</button>
        <button class="rec-cancel" onclick="stopRecording(false)" title="لغو">✖</button>
    </div>

</div>

<div id="info-modal" class="modal-overlay" onclick="if(event.target===this) closeInfo()">
    <div class="modal">
        <h3 id="info-modal-title">اطلاعات چت</h3>

        <div class="avatar-edit">
            <div class="avatar big" id="info-avatar">👥</div>
            <input type="file" id="chat-photo-input" accept="image/*" style="display:none" onchange="uploadChatPhoto(this)">
        </div>

        <label>نام</label>
        <input id="info-name" type="text">
        <label>توضیحات</label>
        <input id="info-desc" type="text">

        <div id="info-admin-tools" style="display:none">
            <button onclick="saveChatInfo()">💾 ذخیره تغییرات</button>
        </div>

        <hr class="sep">

        <label>اعضا:</label>
        <div id="members-list" class="members-list"></div>

        <div id="add-member-sec" style="display:none">
            <label>افزودن عضو (با @آیدی، ایمیل یا شماره):</label>
            <input id="add-member-q" type="text"
                onkeydown="if(event.key === 'Enter') addMember()">
            <button onclick="addMember()">افزودن ➕</button>
        </div>

        <hr class="sep">

        <label>لینک دعوت:</label>
        <input id="info-invite" readonly onclick="this.select()">
        <button onclick="copyInfoInvite()">کپی 📋</button>
        <button class="gray" onclick="closeInfo()">بستن</button>
    </div>
</div>

<div id="fw-modal" class="modal-overlay" onclick="if(event.target===this) closeForward()">
    <div class="modal">
        <h3>فوروارد به...</h3>
        <div id="fw-list" class="fw-list"></div>
        <button class="gray" onclick="closeForward()">انصراف</button>
    </div>
</div>

<div id="msg-menu"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="app.js?v=14"></script>
<!-- 📞 تماس صوتی و تصویری (جدید) — فقط این خط اضافه شده -->
<script type="module" src="call.js?v=1"></script>
<script>
/* ============================================================
   🎯 دکمه‌ی ارسال فقط وقتی چیزی تایپ شده باشه ظاهر میشه
   ============================================================ */
(function () {
  var inp = document.getElementById("messageInput");
  var btn = document.getElementById("send-btn");
  if (!inp || !btn) return;

  function rzUpdateSend() {
    var hasText = inp.value.trim().length > 0;
    btn.classList.toggle("rz-on", hasText);
  }

  inp.addEventListener("input", rzUpdateSend);
  inp.addEventListener("change", rzUpdateSend);

  /* وقتی app.js بعد از ارسال، input.value رو خودش خالی می‌کنه هم دکمه محو بشه */
  try {
    var d = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
    Object.defineProperty(inp, "value", {
      get: function () { return d.get.call(inp); },
      set: function (v) { d.set.call(inp, v); rzUpdateSend(); }
    });
  } catch (e) { /* اگر مرورگر اجازه نداد، فقط رویدادهای تایپ کار می‌کنن */ }

  rzUpdateSend();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
