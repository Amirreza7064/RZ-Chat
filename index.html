<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RZ-Chat Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">
    <h2>RZ-Chat</h2>

    <div class="tabs">
        <button class="tab active" onclick="showTab('email')">ایمیل</button>
        <button class="tab" onclick="showTab('phone')">شماره تلفن</button>
    </div>

    <div id="email-tab">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button onclick="registerUser()">ثبت نام</button>
        <button onclick="loginUser()">ورود</button>
    </div>

    <div id="phone-tab" style="display:none">
        <p class="hint">
            شماره‌ات آیدی حسابت می‌شود. برای تأیید، یک لینک ورود به
            ایمیلت فرستاده می‌شود — بدون پیامک و بدون رمز عبور 🆓
        </p>
        <input id="phone" type="tel" placeholder="09123456789">
        <input id="phone-email" type="email" placeholder="Email (فقط هنگام ثبت‌نام)">
        <button onclick="phoneLogin()">ورود / ثبت‌نام</button>
        <p id="phone-status" class="hint"></p>
    </div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
